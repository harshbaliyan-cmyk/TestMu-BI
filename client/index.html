<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2ea" />
    <!-- Without an explicit icon the browser requests /favicon.ico and 404s
         on every page load — noise in the console and in server logs. -->
    <link rel="icon" type="image/png" href="/testmu-bi-logo-v3.png" />
    <title>TestMu BI</title>
    <meta name="description" content="Your revenue. Always live. Turn Tableau data into live, shareable boards with TestMu BI." />
    <meta property="og:title" content="TestMu BI" />
    <meta property="og:description" content="Your revenue. Always live. Turn Tableau data into live, shareable boards." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/testmu-bi-logo-v3.png" />
    <script>
      document.documentElement.dataset.theme = localStorage.getItem('testmu-theme') || 'dark';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
